name: Render message

# Splits the kept parts of the recording into pieces that separate machines compress at the same time,
# makes the sound alongside, then joins everything and sends it to Vimeo and Drive.

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Message id
        required: true
      request_id:
        description: Render request id
        required: true
      dry_run:
        description: Practice run (does the work, uploads and changes nothing)
        required: false
        default: 'false'

# Pushing to Render again on the same message cancels the older render
concurrency:
  group: render-${{ inputs.message_id }}${{ inputs.dry_run == 'true' && '-practice' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      info: ${{ steps.plan.outputs.info }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Plan the pieces
        id: plan
        env:
          RENDER_MODE: plan
          WORK_DIR: ${{ runner.temp }}/md
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"

  piece:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 10
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make room for large recordings (in the background)
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Compress this piece
        env:
          RENDER_MODE: piece
          PIECE: ${{ toJSON(matrix.chunk) }}
          INFO: ${{ needs.plan.outputs.info }}
          WORK_DIR: ${{ runner.temp }}/md
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: piece-${{ matrix.chunk.i }}
          path: ${{ runner.temp }}/md/piece-*.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  audio:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make room for large recordings (in the background)
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Make the sound and the MP3
        env:
          RENDER_MODE: audio
          INFO: ${{ needs.plan.outputs.info }}
          WORK_DIR: ${{ runner.temp }}/md
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sound
          path: |
            ${{ runner.temp }}/md/final.m4a
            ${{ runner.temp }}/md/final.mp3
          retention-days: 1
          if-no-files-found: error

  finish:
    needs: [plan, piece, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/md/parts
          merge-multiple: true
      - name: Join, upload to Vimeo and save to Drive
        env:
          RENDER_MODE: finish
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          WORK_DIR: ${{ runner.temp }}/md
          PARTS_DIR: ${{ runner.temp }}/md/parts
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"

  failed:
    needs: [plan, piece, audio, finish]
    if: failure() && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tell the app the render stopped
        env:
          RENDER_MODE: failed
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"
