name: Render message

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Message id
        required: true
      request_id:
        description: Render request id
        required: true

# Pushing to Render again on the same message cancels the older render
concurrency:
  group: render-${{ inputs.message_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make room for large recordings
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h .
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
      - name: Render
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          WORK_DIR: ${{ runner.temp }}/md
        run: node worker/render.js "${{ inputs.message_id }}" "${{ inputs.request_id }}"
